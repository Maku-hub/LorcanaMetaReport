name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is a first-class target here, not an afterthought: the console-encoding
    # bug this project hit only shows up on a non-UTF-8 code page, and the shell
    # differences only show up on PowerShell.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installing the project is also what puts `lorcana-meta` on PATH, so the
      # steps below exercise the same entry point a user gets.
      - name: Install
        run: python -m pip install -e .

      - name: Pipeline tests
        run: python tests/test_pipeline.py

      - name: Archetype clustering tests
        run: python tests/test_cluster.py

      - name: Local source and importer tests
        run: python tests/test_local_source.py

      # Fixture-driven, so this needs no permission and no network. It is what tells
      # you inkdecks changed their markup.
      - name: inkdecks parser tests
        run: python tests/test_inkdecks.py

      # The report and the page have to agree on their shape. A key the build stops
      # emitting renders as a blank cell, not an error, so nothing else would catch it.
      - name: Report shape matches what the page reads
        run: python tests/test_report_shape.py

      - name: Build a report end to end from the sample field
        run: |
          python tools/generate_sample_decks.py
          lorcana-meta build --source local --last 40 --top 32

      - name: Check the report
        run: python tests/check_report.py

      # The presentation layer, 1300 lines of it. Needs a built report, so it runs
      # after the build step. Plain node, no npm install - the runners already have it.
      - name: Every page renders and says what it should
        run: node tests/test_render.mjs

      # The offline bundle is the only private-report route, so a regression in it
      # must fail here rather than the next time someone actually needs the file.
      - name: Single-file bundle stays self-contained
        run: python tests/test_bundle.py

  # Kept separate and single-platform: lint results do not vary by OS, and a style
  # complaint should not be able to hide a real test failure in the matrix above.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: an unpinned linter turns someone else's release into your red build.
      - name: Install ruff
        run: python -m pip install "ruff==0.16.6"

      - name: Lint
        run: ruff check .

  # A legacy Windows code page is what broke printing card names. Prove the fix
  # holds rather than trusting that every runner happens to be on UTF-8.
  windows-legacy-encoding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Build with a non-UTF-8 console
        shell: pwsh
        env:
          PYTHONIOENCODING: cp1250
        run: |
          python tools/generate_sample_decks.py
          lorcana-meta build --source local --last 40 --top 32
          python tests/check_report.py
