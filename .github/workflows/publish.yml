name: publish to GitHub Pages

# Publishes the report as a public web page.
#
# READ THIS BEFORE ENABLING IT
#
# 1. A GitHub Pages site is PUBLIC even when the repository is private. Access
#    control is a GitHub Enterprise Cloud feature for organization-owned repos; a
#    personal Free or Pro account cannot make a Pages site private at all. If the
#    report is for you only, do not use this - build the single-file report instead:
#      python tools/bundle_report.py   ->  report.html
#
# 2. It cannot publish inkdecks data. That source is licensed for private use, sets
#    publishable = False, and tests/check_report.py fails on it - deliberately, so a
#    private-use licence cannot leak onto a public URL by accident.
#
# So the only source this can publish is `local`: decklists you supplied and are
# allowed to redistribute. That is a narrow use, which is why this runs only when you
# ask it to - no cron, no run-on-push.
#
# Setup, once: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to include"
        default: "30"
      top:
        description: "Keep finishes this high or better (0 = all)"
        default: "32"
      format:
        description: "Format label for decks that do not carry one"
        default: "Core Constructed"
      sample:
        description: "Publish the synthetic sample field instead of data/decks"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[inkdecks]"

      - name: Cache the card database
        uses: actions/cache@v4
        with:
          path: .cache
          key: cards-${{ github.run_id }}
          restore-keys: cards-

      - name: Build the report
        env:
          DAYS: ${{ github.event.inputs.days || '30' }}
          TOP: ${{ github.event.inputs.top || '32' }}
          FMT: ${{ github.event.inputs.format || 'Core Constructed' }}
          SAMPLE: ${{ github.event.inputs.sample }}
        run: |
          set -euo pipefail
          if [ "$SAMPLE" = "true" ]; then
            echo "::warning::Publishing the synthetic sample field. It is invented data, and the page says so on its own front page."
            python tools/generate_sample_decks.py
          fi
          lorcana-meta build --source local --last "$DAYS" --top "$TOP" --format "$FMT"

      # Refuses anything marked unpublishable, which is what keeps inkdecks data off
      # a public URL even if someone points this at the wrong build.
      - name: Check the report before publishing it
        run: python tests/check_report.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
