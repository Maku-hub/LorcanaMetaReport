[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorcana-meta"
version = "0.1.0"
description = "Build a Disney Lorcana tournament-meta report and publish it as a static site"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.32"]

# Everything the inkdecks source needs. Kept out of the core install so someone
# using only local decklists does not pull in an HTML parser and a bot-filter client.
#
# curl_cffi lives here rather than behind its own extra because the fallback fires
# mid-run, hours into a build, and "install this and start over" is a bad thing to
# discover then. Installed-but-idle is the cheaper failure. It is only *used* when
# the site refuses the plain path - see sources/inkdecks.py for why that is an
# agreement being exercised rather than a control being circumvented.
[project.optional-dependencies]
inkdecks = ["beautifulsoup4>=4.12", "curl_cffi>=0.7"]

[project.urls]
Source = "https://github.com/"

# Installing the project puts `lorcana-meta` on PATH, which is the same command on
# Windows, macOS and Linux. Without it the only way in is `PYTHONPATH=src python -m
# lorcana_meta`, and that prefix is POSIX shell syntax - PowerShell reads it as a
# command name and fails.
[project.scripts]
lorcana-meta = "lorcana_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
