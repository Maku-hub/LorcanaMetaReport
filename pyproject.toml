[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorcana-meta"
version = "0.1.0"
description = "Build a Disney Lorcana tournament-meta report and publish it as a static site"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# One list, no extras. There used to be an `[inkdecks]` extra holding the HTML parser
# and the HTTP client, on the theory that a local-decklists-only user should not carry
# them. It cost more than it saved: the documented install was `pip install -e .`,
# which quietly produced an installation that could not read the default source, and
# the failure surfaced as "package not installed" for a package that was installed -
# just not for that interpreter, and not in that extra.
#
# curl_cffi is not optional now that it is the only transport. See
# sources/inkdecks.py for why using it is an agreement being exercised rather than a
# control being circumvented.
dependencies = [
    "requests>=2.32",        # the card database
    "beautifulsoup4>=4.12",  # parsing scraped HTML
    "curl_cffi>=0.7",        # the HTTP client the site will actually answer
]

[project.urls]
Source = "https://github.com/"

# Installing the project puts `lorcana-meta` on PATH, which is the same command on
# Windows, macOS and Linux. Without it the only way in is `PYTHONPATH=src python -m
# lorcana_meta`, and that prefix is POSIX shell syntax - PowerShell reads it as a
# command name and fails.
[project.scripts]
lorcana-meta = "lorcana_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
